services:
  - type: web
    name: auto-tiktok-editor-license-server
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn license_server.app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: AUTO_EDITOR_LICENSE_PUBLIC_BASE_URL
        sync: false
      - key: AUTO_EDITOR_LICENSE_DATABASE_URL
        sync: false
      - key: AUTO_EDITOR_LICENSE_SIGNING_SEED_B64
        sync: false
      - key: AUTO_EDITOR_LICENSE_ADMIN_SESSION_SECRET
        sync: false
